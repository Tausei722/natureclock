name: NatureClock
options:
  bundleIdPrefix: com.Tausei722
  deploymentTarget:
    iOS: "16.0"
targets:
  NatureClock:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - NatureClock
    info:
      path: NatureClock/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "現在地から日の出・日の入りを計算するために使用します"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.Tausei722.natureclock
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
